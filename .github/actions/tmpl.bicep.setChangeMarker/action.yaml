name: Set Change Marker Tag
description: Sets a Git tag to mark the last commit for detecting module changes

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: true
    - name: Update Tags
      shell: pwsh
      run: |
        $branch   = "${{ github.ref_name }}" # git branch --show-current
        $tagName  = "meta-last-publish-marker-$branch"
        $message  = "DO NOT DELETE | Tracks when commit for detecting module changes"

        git config user.name "GitHubActions"
        git config user.email "actions@github.com"

        # Tag the commit that was actually processed, not the current branch head.
        # Commits landing in between are picked up by the next run.
        git tag $tagName ${{ github.sha }} -m "$message" --force
        git push origin $tagName --force
